<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Document Assistant</title>
</head>

<body style="max-width:700px;margin:40px auto;font-family:Arial;">

<h2>AI Document Assistant</h2>

<!-- ================= SESSION ================= -->
<script>
let session_id = null;

async function initSession() {
    const res = await fetch("/session");
    const data = await res.json();
    session_id = data.session_id;
}
initSession();
</script>

<hr>

<!-- ================= UPLOAD ================= -->
<h3>1. Upload document</h3>

<input type="file" id="file">

<br><br>

<label>Summary level:</label>
<select id="level">
    <option value="brief">Brief</option>
    <option value="standard" selected>Standard</option>
    <option value="detailed">Detailed</option>
</select>

<br><br>

<button onclick="upload()">Generate summary</button>

<p id="upload_loading" style="color:blue;"></p>
<p id="summary"></p>

<hr>

<!-- ================= QUESTION STEP ================= -->
<div id="question_block" style="display:none;">
    <h3>2. Do you want to ask questions?</h3>

    <button onclick="enableChat()">Yes</button>
    <button onclick="disableChat()">No</button>
</div>

<hr>

<!-- ================= CHAT INIT ================= -->
<div id="chat_init_block" style="display:none;">
    <h3>3. Initialize Q&A</h3>

    <button onclick="startChat()">Build embeddings</button>

    <p id="chat_loading" style="color:blue;"></p>
    <p id="chat_status"></p>
</div>

<hr>

<!-- ================= CHAT ================= -->
<div id="chat_block" style="display:none;">
    <h3>4. Ask questions</h3>

    <input id="question" placeholder="Ask a question..." style="width:100%;padding:8px;">

    <br><br>

    <button onclick="ask()">Send</button>

    <p id="ask_loading" style="color:blue;"></p>
    <p id="answer"></p>
</div>

<!-- ================= JS ================= -->
<script>

// ----------- RESET UI -----------
function resetUI() {
    document.getElementById("summary").innerText = "";
    document.getElementById("answer").innerText = "";
    document.getElementById("chat_status").innerText = "";

    document.getElementById("upload_loading").innerText = "";
    document.getElementById("chat_loading").innerText = "";
    document.getElementById("ask_loading").innerText = "";

    document.getElementById("question_block").style.display = "none";
    document.getElementById("chat_init_block").style.display = "none";
    document.getElementById("chat_block").style.display = "none";
}

// ----------- CHECK SESSION -----------
function checkSession() {
    if (!session_id) {
        alert("Session not ready");
        return false;
    }
    return true;
}

// ----------- UPLOAD -----------
async function upload() {

    if (!checkSession()) return;

    // ✔ RESET COMPLET AVANT NOUVEAU DOC
    resetUI();

    let file = document.getElementById("file").files[0];
    let level = document.getElementById("level").value;

    document.getElementById("upload_loading").innerText =
        "Processing document and generating summary...";

    let form = new FormData();
    form.append("session_id", session_id);
    form.append("file", file);
    form.append("level", level);

    const res = await fetch("/upload", {
        method: "POST",
        body: form
    });

    const data = await res.json();

    document.getElementById("upload_loading").innerText = "";

    document.getElementById("summary").innerText =
        data.summary || "Error generating summary";

    // Affiche étape suivante
    document.getElementById("question_block").style.display = "block";
}

// ----------- USER CHOICE -----------
function enableChat() {
    document.getElementById("chat_init_block").style.display = "block";
}

function disableChat() {
    document.getElementById("chat_init_block").style.display = "none";
    document.getElementById("chat_block").style.display = "none";
}

// ----------- BUILD EMBEDDINGS -----------
async function startChat() {

    if (!checkSession()) return;

    document.getElementById("chat_loading").innerText =
        "Building embeddings (one-time process)...";

    let form = new FormData();
    form.append("session_id", session_id);

    const res = await fetch("/start_chat", {
        method: "POST",
        body: form
    });

    const data = await res.json();

    document.getElementById("chat_loading").innerText = "";

    if (data.status === "ready") {
        document.getElementById("chat_status").innerText = "Q&A ready";

        // ✔ AFFICHER INPUT SEULEMENT ICI
        document.getElementById("chat_block").style.display = "block";
    } else {
        document.getElementById("chat_status").innerText = "Error initializing chat";
    }
}

// ----------- ASK -----------
async function ask() {

    if (!checkSession()) return;

    let question = document.getElementById("question").value;

    document.getElementById("ask_loading").innerText =
        "Searching in document...";

    let form = new FormData();
    form.append("session_id", session_id);
    form.append("question", question);

    const res = await fetch("/ask", {
        method: "POST",
        body: form
    });

    const data = await res.json();

    document.getElementById("ask_loading").innerText = "";

    document.getElementById("answer").innerText =
        data.answer || "No answer found";
}

</script>

</body>
</html>
