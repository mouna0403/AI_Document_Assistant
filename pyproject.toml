[project]
name = "summarizer-app"
version = "0.1.0"
description = "PDF summarizer with Groq LLM"
requires-python = ">=3.11,<4"

# Main dependencies


dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.0",
    "python-multipart==0.0.9",

    "langchain==0.3.27",
    "langchain-core==0.3.72",
    "langchain-community==0.3.21",
    "langchain-text-splitters==0.3.9",
    "langchain-groq==0.2.0",

    "faiss-cpu==1.8.0.post1",
    "numpy==1.26.4",
    "sentence-transformers==3.0.1",

    "python-dotenv==1.0.1",

    "pypdf==4.3.0",
    "python-docx==1.1.2",
    "pandas==2.2.2",

    "pillow==10.0.0",
    "pytesseract==0.3.10",
    "pdf2image==1.16.3",
]

[project.optional-dependencies]
test = [
    "pytest==8.0.0",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",

]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_summarizer"]

[dependency-groups]
dev = [
    "pytest==8.0.0",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "reportlab==4.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
